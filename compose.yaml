name: auction-house

x-backend: &backend
  image: auction-house-api:local
  build:
    context: ./backend
    target: runtime
  environment:
    MEDIA_DIR: /data/media
    AUTH_SECRET: ${AUTH_SECRET:-}
    AUDIT_SECRET: ${AUDIT_SECRET:-}
    ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-30}
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-auction}:${POSTGRES_PASSWORD:-auction_dev}@db:5432/${POSTGRES_DB:-auction_house}
    DATABASE_URL_UNPOOLED: postgresql+psycopg://${POSTGRES_USER:-auction}:${POSTGRES_PASSWORD:-auction_dev}@db:5432/${POSTGRES_DB:-auction_house}

services:
  db:
    image: postgres:17.9-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-auction}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auction_dev}
      POSTGRES_DB: ${POSTGRES_DB:-auction_house}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *backend
    command: ['alembic', '-c', 'alembic.ini', 'upgrade', 'head']
    depends_on:
      db:
        condition: service_healthy
    restart: 'no'

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'
    volumes:
      - item_media:/data/media
      - audit_checkpoints:/data/audit:ro
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_USE_MOCK: ${VITE_USE_MOCK:-false}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '127.0.0.1:${FRONTEND_PORT:-5174}:80'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  test:
    profiles: ['test']
    build:
      context: ./backend
      target: test
    environment:
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-auction}:${POSTGRES_PASSWORD:-auction_dev}@db:5432/${POSTGRES_DB:-auction_house}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pg_data:
  item_media:
  audit_checkpoints:
