[project]
name = "auction-house-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16,<2",
    "anyio>=4,<5",
    "email-validator>=2,<3",
    "fastapi",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3,<1",
    "pydantic-settings>=2,<3",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn",
    "websockets>=15,<17",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pytest",
    "ruff",
]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers --strict-config -ra"
