name: Publish API image

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/publish-api.yml

permissions:
  contents: read

concurrency:
  group: publish-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Build persistent API and worker image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile.render
          push: true
          tags: |
            ghcr.io/gabriellin1227/auction-house-api:latest
            ghcr.io/gabriellin1227/auction-house-api:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Gabriellin1227/auction-house
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
