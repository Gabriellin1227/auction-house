name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    name: Frontend quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check:frontend
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.13.6'
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv python install 3.12
      - run: uv sync --project backend --locked --python 3.12
      - run: uv run --project backend --locked ruff check backend
      - run: uv run --project backend --locked ruff format --check backend
      - run: uv run --project backend --locked pytest -c backend/pyproject.toml
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HUSKY: '0'
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm exec --no -- commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
